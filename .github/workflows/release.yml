name: Release

# 打 tag 推送自动构建发布;或手动触发补发历史版本
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要构建发布的 tag(如 v1.5.45)'
        required: true
        default: 'v1.5.45'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-key.jks"

      - name: Build APKs
        env:
          ANDROID_SIGNE_PATH: ${{ runner.temp }}/release-key.jks
          ANDROID_SIGNE_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNE_STORE_PASSWORD }}
          ANDROID_SIGNE_ALIAS: ${{ secrets.ANDROID_SIGNE_ALIAS }}
          ANDROID_SIGNE_PASSWORD: ${{ secrets.ANDROID_SIGNE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assemblePubAppRelease assemblePubAppDebug --no-daemon

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "自动构建发布"
          gh release upload "$TAG" \
            app/build/outputs/apk/pubApp/release/*.apk \
            app/build/outputs/apk/pubApp/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
